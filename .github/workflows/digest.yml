name: Daily Playbook email

# Runs hourly. The endpoint decides whether anything is due: it waits for the send hour set in /admin/settings
# (default 10:00 Harare) and for today's article, then sends to whoever has not had it yet, a batch at a time.
# Hourly also means GitHub's late starts never lose a day, and a long subscriber list drains over a few runs.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call the digest cron endpoint
        run: |
          curl --fail-with-body -sS --max-time 90 -X POST \
            "${{ secrets.SITE_URL }}/api/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
