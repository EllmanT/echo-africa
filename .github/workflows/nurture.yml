name: Nurture email sequence

# Runs hourly. Each lead only ever gets one email per run, so an hourly
# cadence is plenty for 1h/24h reminders and a day 1/3/6/10 sequence.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

jobs:
  nurture:
    runs-on: ubuntu-latest
    steps:
      - name: Call the nurture cron endpoint
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.SITE_URL }}/api/cron/nurture" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
