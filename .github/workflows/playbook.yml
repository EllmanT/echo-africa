name: Playbook article engine

# One article a day at 08:00 Harare time (Harare is UTC+2 all year, so 06:00 UTC), two hours before the daily email.
# A second call at 10:00 Harare is a safety net: it does nothing when the article is already live (the daily cap
# makes it a green skip), and retries once when the first run failed.
# Cost is capped separately: the site refuses to write more once this month's real
# spend reaches the monthly budget set in /admin/settings (default $1).
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Playbook cron endpoint
        run: |
          curl --fail-with-body -sS --max-time 120 -X POST \
            "${{ secrets.SITE_URL }}/api/cron/playbook?slot=morning" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
